<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TransitOps — Dispatch Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F14;
  --panel:#121822;
  --panel-2:#1A222E;
  --panel-3:#212C3A;
  --border:#26303D;
  --border-soft:#1D2530;
  --text:#EAF0F6;
  --text-dim:#8A97A6;
  --text-faint:#57626F;
  --amber:#FFB020;
  --amber-dim:#4A3712;
  --go:#34D399;
  --go-dim:#123A2C;
  --red:#F85149;
  --red-dim:#3D1618;
  --blue:#4FA3F7;
  --blue-dim:#132A3F;
  --radius:8px;
  --font-display:'Barlow Condensed',sans-serif;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;min-height:100vh;
  background-image:
    repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--amber-dim);color:var(--amber);}

/* ---------- Shell ---------- */
#app{max-width:1180px;margin:0 auto;padding:0 22px 70px;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px;
  border-bottom:2px solid var(--border);margin-bottom:22px;position:sticky;top:0;background:var(--bg);z-index:10;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:34px;height:34px;border-radius:6px;background:var(--panel-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--amber);font-family:var(--font-display);font-weight:700;font-size:16px;
}
.brand-text h1{font-family:var(--font-display);font-weight:700;font-size:21px;margin:0;letter-spacing:0.3px;}
.brand-text span{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);letter-spacing:1.5px;text-transform:uppercase;}
.shift-info{display:flex;align-items:center;gap:16px;}
.shift-clock{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);}
.role-badge{
  display:flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--border);
  border-radius:20px;padding:6px 12px 6px 8px;font-size:12px;color:var(--text-dim);
}
.role-badge .sig{width:8px;height:8px;border-radius:50%;background:var(--go);box-shadow:0 0 6px var(--go);}

/* ---------- Signal strip (KPIs) ---------- */
.signal-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:26px;}
.signal{
  background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:14px 15px;
  position:relative;
}
.signal::before{content:"";position:absolute;top:12px;right:12px;width:7px;height:7px;border-radius:50%;background:var(--sig-color,var(--text-faint));}
.signal-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);font-weight:600;}
.signal-value{font-family:var(--font-display);font-size:30px;font-weight:700;margin-top:4px;}
.signal-value span{font-size:14px;color:var(--text-faint);font-family:var(--font-body);font-weight:400;}

/* ---------- Section head ---------- */
.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.section-head h2{font-family:var(--font-display);font-size:23px;margin:0;font-weight:700;}
.section-head p{margin:2px 0 0;color:var(--text-dim);font-size:12.5px;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:6px;border:1px solid var(--border);
  background:var(--panel-2);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;transition:all .12s;white-space:nowrap;
}
.btn:hover{background:var(--panel-3);border-color:#3A4453;}
.btn-amber{background:var(--amber);border-color:var(--amber);color:#221800;}
.btn-amber:hover{background:#ffc450;}
.btn-go{color:var(--go);}
.btn-go:hover{background:var(--go-dim);border-color:var(--go);}
.btn-red{color:var(--red);}
.btn-red:hover{background:var(--red-dim);border-color:var(--red);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:5px;}
.btn[disabled]{opacity:0.3;cursor:not-allowed;}
.btn[disabled]:hover{background:var(--panel-2);border-color:var(--border);}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--border-soft);}
.tab{
  padding:9px 16px;font-size:13px;font-weight:600;color:var(--text-faint);cursor:pointer;border-bottom:2px solid transparent;
  display:flex;align-items:center;gap:7px;
}
.tab:hover{color:var(--text-dim);}
.tab.active{color:var(--amber);border-bottom-color:var(--amber);}
.tab .count{
  background:var(--panel-2);border-radius:10px;padding:1px 7px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);
}
.tab.active .count{background:var(--amber-dim);color:var(--amber);}

/* ---------- Ticket board ---------- */
.board{display:flex;flex-direction:column;gap:12px;}
.ticket{
  background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);
  position:relative;overflow:hidden;display:flex;
}
.ticket-stub{
  width:88px;flex-shrink:0;border-right:1px dashed var(--border);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:10px 6px;background:var(--panel-2);gap:4px;
}
.ticket-stub .tnum{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}
.ticket-stub .ticon{font-size:20px;}
.ticket-body{flex:1;padding:14px 18px;min-width:0;}
.ticket-route{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:19px;font-weight:700;}
.ticket-route .arrow{color:var(--text-faint);font-size:15px;}
.ticket-meta-row{display:flex;flex-wrap:wrap;gap:18px;margin-top:9px;}
.tm{display:flex;flex-direction:column;gap:2px;}
.tm label{font-size:9.5px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-faint);font-weight:600;}
.tm b{font-family:var(--font-mono);font-size:13px;font-weight:500;}
.ticket-actions{display:flex;align-items:center;gap:8px;padding:14px 18px;flex-shrink:0;border-left:1px solid var(--border-soft);}
.stamp{
  position:absolute;top:10px;right:16px;font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:2px;
  padding:3px 10px;border:2px solid; border-radius:4px;transform:rotate(4deg);opacity:0.9;text-transform:uppercase;
}
.stamp-draft{color:var(--text-faint);border-color:var(--text-faint);}
.stamp-dispatched{color:var(--blue);border-color:var(--blue);}
.stamp-completed{color:var(--go);border-color:var(--go);}
.stamp-cancelled{color:var(--red);border-color:var(--red);}

.empty-state{
  padding:60px 20px;text-align:center;color:var(--text-faint);background:var(--panel);border:1px dashed var(--border);
  border-radius:var(--radius);
}
.empty-state .glyph{font-size:30px;margin-bottom:10px;opacity:0.6;}

/* ---------- Availability rail ---------- */
.rail{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px;}
.rail-col h3{font-family:var(--font-display);font-size:16px;margin:0 0 10px;font-weight:700;color:var(--text-dim);}
.avail-list{display:flex;flex-direction:column;gap:6px;}
.avail-item{
  display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--border-soft);
  border-radius:6px;padding:9px 13px;font-size:12.5px;
}
.avail-item .name{font-weight:600;}
.avail-item .sub{color:var(--text-faint);font-family:var(--font-mono);font-size:11px;}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:0.4px;
}
.badge-go{background:var(--go-dim);color:var(--go);}
.badge-blue{background:var(--blue-dim);color:var(--blue);}
.badge-red{background:var(--red-dim);color:var(--red);}
.badge-neutral{background:var(--panel-3);color:var(--text-dim);}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(3,5,8,0.72);display:flex;align-items:center;justify-content:center;z-index:100;
  padding:20px;
}
.modal{
  background:var(--panel);border:1px solid var(--border);border-radius:10px;width:100%;max-width:460px;
  max-height:88vh;overflow-y:auto;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border-soft);}
.modal-head h3{margin:0;font-family:var(--font-display);font-size:19px;font-weight:700;}
.modal-close{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:16px;padding:4px;}
.modal-close:hover{color:var(--red);}
.modal-body{padding:18px 20px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border-soft);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-faint);font-weight:600;margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:6px;font-size:13.5px;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--amber);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field select:disabled{opacity:0.4;}
.hint{font-size:11px;color:var(--text-faint);margin-top:5px;}
.hint.warn{color:var(--red);}
.form-alert{background:var(--red-dim);color:var(--red);border:1px solid var(--red);border-radius:6px;padding:9px 12px;font-size:12.5px;margin-bottom:14px;}
.cap-check{font-size:11.5px;margin-top:5px;font-family:var(--font-mono);}
.cap-ok{color:var(--go);}
.cap-bad{color:var(--red);}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{
  background:var(--panel-2);border:1px solid var(--border);border-left:3px solid var(--go);border-radius:6px;
  padding:11px 16px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,0.4);animation:slidein .18s ease-out;max-width:300px;
}
@keyframes slidein{from{transform:translateX(20px);opacity:0;}to{transform:translateX(0);opacity:1;}}

@media(max-width:820px){
  .signal-strip{grid-template-columns:repeat(2,1fr);}
  .rail{grid-template-columns:1fr;}
  .ticket{flex-direction:column;}
  .ticket-stub{width:100%;flex-direction:row;border-right:none;border-bottom:1px dashed var(--border);}
  .ticket-actions{border-left:none;border-top:1px solid var(--border-soft);}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>


const STORAGE_KEY = 'transitops_dispatcher_v1';

function uid(){ return 't-' + Math.random().toString(36).slice(2,9); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function fmtMoney(n){ return '₹' + Number(n||0).toLocaleString('en-IN'); }


const VEHICLES = [
  {id:'v1', regNo:'MH-12-AB-3311', name:'Tata Ace Gold', type:'Mini Truck', maxCapacity:750,  status:'Available'},
  {id:'v2', regNo:'MH-14-CD-7790', name:'Ashok Leyland Dost+', type:'LCV',    maxCapacity:1500, status:'Available'},
  {id:'v3', regNo:'MH-04-EF-1205', name:'Eicher Pro 2049', type:'Truck',    maxCapacity:5000, status:'On Trip'},
  {id:'v4', regNo:'MH-31-GH-4482', name:'Tata 407 Gold', type:'Mini Truck', maxCapacity:2500, status:'In Shop'},
  {id:'v5', regNo:'MH-20-IJ-9031', name:'Mahindra Bolero Pickup', type:'Pickup', maxCapacity:1000, status:'Available'},
  {id:'v6', regNo:'MH-01-KL-6620', name:'Bharat Benz 1617', type:'Truck', maxCapacity:9000, status:'Retired'},
];
const DRIVERS = [
  {id:'d1', name:'Alex Menon', licenseNo:'DL-MH-2019-0441', licenseCategory:'LMV-TR', licenseExpiry:'2027-03-15', safetyScore:92, status:'Available'},
  {id:'d2', name:'Ravi Kumar', licenseNo:'DL-UP-2017-1029', licenseCategory:'HMV', licenseExpiry:'2026-11-02', safetyScore:81, status:'On Trip'},
  {id:'d3', name:'Priya Nair', licenseNo:'DL-KA-2020-0788', licenseCategory:'HMV', licenseExpiry:'2026-08-30', safetyScore:88, status:'Available'},
  {id:'d4', name:'Sanjay Verma', licenseNo:'DL-RJ-2015-0334', licenseCategory:'LMV-TR', licenseExpiry:'2025-01-10', safetyScore:64, status:'Suspended'},
  {id:'d5', name:'Fatima Sheikh', licenseNo:'DL-MH-2021-0902', licenseCategory:'HMV', licenseExpiry:'2026-09-20', safetyScore:95, status:'Available'},
];

let state = {
  trips: [],
  activeTab: 'Draft',
};


function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const parsed = JSON.parse(raw); state.trips = parsed.trips || []; return true; }
  }catch(e){}
  return false;
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({trips: state.trips}));
}
function seedTrips(){
  state.trips = [
    {id:uid(), source:'Nagpur', destination:'Raipur', vehicleId:'v3', driverId:'d2', cargoWeight:3200, plannedDistance:290,
     actualDistance:null, fuelConsumed:null, revenue:42000, status:'Dispatched', createdAt:todayStr(), dispatchedAt:todayStr()},
    {id:uid(), source:'Pune', destination:'Mumbai', vehicleId:null, driverId:null, cargoWeight:600, plannedDistance:150,
     actualDistance:null, fuelConsumed:null, revenue:9000, status:'Draft', createdAt:todayStr()},
  ];
  saveState();
}

function getVehicle(id){ return VEHICLES.find(v=>v.id===id); }
function getDriver(id){ return DRIVERS.find(d=>d.id===id); }

function availableVehicles(excludeCurrent){
  return VEHICLES.filter(v => v.status==='Available' || v.id===excludeCurrent);
}
function availableDrivers(excludeCurrent){
  const today = todayStr();
  return DRIVERS.filter(d => (d.status==='Available' && d.licenseExpiry >= today) || d.id===excludeCurrent);
}

function vehicleStatusFromTrips(){
  const onTrip = new Set(state.trips.filter(t=>t.status==='Dispatched').map(t=>t.vehicleId));
  VEHICLES.forEach(v=>{
    if(v.status==='Retired' || v.status==='In Shop') return;
    v.status = onTrip.has(v.id) ? 'On Trip' : 'Available';
  });
}
function driverStatusFromTrips(){
  const onTrip = new Set(state.trips.filter(t=>t.status==='Dispatched').map(t=>t.driverId));
  DRIVERS.forEach(d=>{
    if(d.status==='Suspended') return;
    d.status = onTrip.has(d.id) ? 'On Trip' : 'Available';
  });
}

function kpis(){
  vehicleStatusFromTrips(); driverStatusFromTrips();
  const activeTrips = state.trips.filter(t=>t.status==='Dispatched').length;
  const pendingTrips = state.trips.filter(t=>t.status==='Draft').length;
  const availVeh = VEHICLES.filter(v=>v.status==='Available').length;
  const availDrv = DRIVERS.filter(d=>d.status==='Available').length;
  const completedToday = state.trips.filter(t=>t.status==='Completed' && t.completedAt===todayStr()).length;
  return {activeTrips, pendingTrips, availVeh, availDrv, completedToday};
}


function validateNewTrip(data){
  if(!data.source || !data.destination) throw new Error('Enter both source and destination.');
  if(!data.cargoWeight || Number(data.cargoWeight) <= 0) throw new Error('Enter a valid cargo weight.');
  if(!data.plannedDistance || Number(data.plannedDistance) <= 0) throw new Error('Enter a valid planned distance.');
  return true;
}
function validateDispatch(trip, vehicleId, driverId){
  const v = getVehicle(vehicleId), d = getDriver(driverId);
  if(!v) throw new Error('Select a vehicle.');
  if(!d) throw new Error('Select a driver.');
  if(v.status==='Retired' || v.status==='In Shop') throw new Error(`${v.regNo} is not available for dispatch (${v.status}).`);
  if(v.status==='On Trip') throw new Error(`${v.regNo} is already on another trip.`);
  if(d.status==='Suspended') throw new Error(`${d.name} is suspended and cannot be assigned.`);
  if(d.licenseExpiry < todayStr()) throw new Error(`${d.name}'s license expired on ${d.licenseExpiry}.`);
  if(d.status==='On Trip') throw new Error(`${d.name} is already on another trip.`);
  if(Number(trip.cargoWeight) > Number(v.maxCapacity)){
    throw new Error(`Cargo weight (${trip.cargoWeight} kg) exceeds ${v.regNo}'s max capacity (${v.maxCapacity} kg).`);
  }
  return true;
}


function createTrip(data){
  validateNewTrip(data);
  const trip = {
    id: uid(), source:data.source.trim(), destination:data.destination.trim(),
    vehicleId:null, driverId:null, cargoWeight:Number(data.cargoWeight), plannedDistance:Number(data.plannedDistance),
    actualDistance:null, fuelConsumed:null, revenue:Number(data.revenue)||0,
    status:'Draft', createdAt:todayStr(), dispatchedAt:null, completedAt:null
  };
  state.trips.unshift(trip);
  saveState();
}
function dispatchTrip(tripId, vehicleId, driverId){
  const trip = state.trips.find(t=>t.id===tripId);
  validateDispatch(trip, vehicleId, driverId);
  trip.vehicleId = vehicleId; trip.driverId = driverId;
  trip.status = 'Dispatched'; trip.dispatchedAt = todayStr();
  vehicleStatusFromTrips(); driverStatusFromTrips();
  saveState();
}
function completeTrip(tripId, actualDistance, fuelConsumed){
  const trip = state.trips.find(t=>t.id===tripId);
  if(!actualDistance || Number(actualDistance)<=0) throw new Error('Enter the final odometer / actual distance.');
  if(fuelConsumed===''||fuelConsumed===undefined||fuelConsumed===null || Number(fuelConsumed)<0) throw new Error('Enter fuel consumed.');
  trip.actualDistance = Number(actualDistance); trip.fuelConsumed = Number(fuelConsumed);
  trip.status = 'Completed'; trip.completedAt = todayStr();
  vehicleStatusFromTrips(); driverStatusFromTrips();
  saveState();
}
function cancelTrip(tripId){
  const trip = state.trips.find(t=>t.id===tripId);
  trip.status = 'Cancelled'; trip.cancelledAt = todayStr();
  vehicleStatusFromTrips(); driverStatusFromTrips();
  saveState();
}


function toast(msg){
  const wrap = document.getElementById('toastWrap');
  const t = el(`<div class="toast">${msg}</div>`);
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2600);
}


function renderTopbar(){
  const bar = el(`<div class="topbar">
    <div class="brand">
      <div class="brand-mark">TO</div>
      <div class="brand-text">
        <h1>Dispatch Console</h1>
        <span>TransitOps · Dispatcher</span>
      </div>
    </div>
    <div class="shift-info">
      <div class="shift-clock" id="clock"></div>
      <div class="role-badge"><div class="sig"></div>On shift · Dispatcher</div>
    </div>
  </div>`);
  const clock = bar.querySelector('#clock');
  const tick = ()=>{ clock.textContent = new Date().toLocaleString('en-IN', {hour:'2-digit', minute:'2-digit', second:'2-digit', day:'2-digit', month:'short'}); };
  tick(); setInterval(tick, 1000);
  return bar;
}

function renderSignalStrip(){
  const k = kpis();
  const items = [
    ['Active trips', k.activeTrips, '', 'var(--blue)'],
    ['Pending dispatch', k.pendingTrips, '', 'var(--amber)'],
    ['Vehicles available', k.availVeh, '/ '+VEHICLES.length, 'var(--go)'],
    ['Drivers available', k.availDrv, '/ '+DRIVERS.length, 'var(--go)'],
    ['Completed today', k.completedToday, '', 'var(--text-faint)'],
  ];
  const strip = el(`<div class="signal-strip"></div>`);
  items.forEach(([label,val,suffix,color])=>{
    const s = el(`<div class="signal" style="--sig-color:${color}"><div class="signal-label">${label}</div><div class="signal-value">${val}<span>${suffix}</span></div></div>`);
    strip.appendChild(s);
  });
  return strip;
}


const TAB_ICON = {Draft:'📝', Dispatched:'🚚', Completed:'✅', Cancelled:'✕'};
const STAMP_CLASS = {Draft:'stamp-draft', Dispatched:'stamp-dispatched', Completed:'stamp-completed', Cancelled:'stamp-cancelled'};

function renderBoardSection(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<div class="section-head">
    <div><h2>Trip board</h2><p>Create, dispatch, complete, and cancel trips</p></div>
    <button class="btn btn-amber" id="newTripBtn">+ New trip</button>
  </div>`));

  const tabsWrap = el(`<div class="tabs"></div>`);
  ['Draft','Dispatched','Completed','Cancelled'].forEach(tabName=>{
    const count = state.trips.filter(t=>t.status===tabName).length;
    const tab = el(`<div class="tab ${state.activeTab===tabName?'active':''}">${TAB_ICON[tabName]} ${tabName} <span class="count">${count}</span></div>`);
    tab.onclick = ()=>{ state.activeTab = tabName; render(); };
    tabsWrap.appendChild(tab);
  });
  wrap.appendChild(tabsWrap);

  const board = el(`<div class="board"></div>`);
  const filtered = state.trips.filter(t=>t.status===state.activeTab);
  if(filtered.length===0){
    board.appendChild(el(`<div class="empty-state"><div class="glyph">${TAB_ICON[state.activeTab]}</div>No ${state.activeTab.toLowerCase()} trips.</div>`));
  } else {
    filtered.forEach(trip=>board.appendChild(renderTicket(trip)));
  }
  wrap.appendChild(board);

  wrap.querySelector('#newTripBtn').onclick = openNewTripModal;
  return wrap;
}

function renderTicket(trip){
  const v = getVehicle(trip.vehicleId), d = getDriver(trip.driverId);
  const t = el(`<div class="ticket">
    <div class="ticket-stub">
      <div class="ticon">${TAB_ICON[trip.status]}</div>
      <div class="tnum">${trip.id.toUpperCase()}</div>
    </div>
    <div class="ticket-body">
      <div class="stamp ${STAMP_CLASS[trip.status]}">${trip.status}</div>
      <div class="ticket-route">${trip.source} <span class="arrow">→</span> ${trip.destination}</div>
      <div class="ticket-meta-row">
        <div class="tm"><label>Vehicle</label><b>${v ? v.regNo : '— unassigned'}</b></div>
        <div class="tm"><label>Driver</label><b>${d ? d.name : '— unassigned'}</b></div>
        <div class="tm"><label>Cargo</label><b>${trip.cargoWeight} kg</b></div>
        <div class="tm"><label>Planned dist.</label><b>${trip.plannedDistance} km</b></div>
        ${trip.actualDistance!=null ? `<div class="tm"><label>Actual dist.</label><b>${trip.actualDistance} km</b></div>`:''}
        ${trip.fuelConsumed!=null ? `<div class="tm"><label>Fuel used</label><b>${trip.fuelConsumed} L</b></div>`:''}
        <div class="tm"><label>Revenue</label><b>${fmtMoney(trip.revenue)}</b></div>
      </div>
    </div>
    <div class="ticket-actions"></div>
  </div>`);
  const actions = t.querySelector('.ticket-actions');
  if(trip.status==='Draft'){
    const b1 = el(`<button class="btn btn-sm btn-go">Dispatch</button>`);
    b1.onclick = ()=>openDispatchModal(trip);
    const b2 = el(`<button class="btn btn-sm btn-red">Cancel</button>`);
    b2.onclick = ()=>{ cancelTrip(trip.id); toast('Trip cancelled.'); render(); };
    actions.append(b1,b2);
  } else if(trip.status==='Dispatched'){
    const b1 = el(`<button class="btn btn-sm btn-go">Complete</button>`);
    b1.onclick = ()=>openCompleteModal(trip);
    const b2 = el(`<button class="btn btn-sm btn-red">Cancel</button>`);
    b2.onclick = ()=>{ cancelTrip(trip.id); toast('Trip cancelled — vehicle & driver freed up.'); render(); };
    actions.append(b1,b2);
  } else {
    actions.appendChild(el(`<span class="hint">No actions</span>`));
  }
  return t;
}


function statusBadge(status){
  const map = {Available:'badge-go', 'On Trip':'badge-blue', 'In Shop':'badge-neutral', Retired:'badge-neutral', Suspended:'badge-red', 'Off Duty':'badge-neutral'};
  return `<span class="badge ${map[status]||'badge-neutral'}">${status}</span>`;
}
function renderAvailabilityRail(){
  vehicleStatusFromTrips(); driverStatusFromTrips();
  const rail = el(`<div class="rail"></div>`);

  const vehCol = el(`<div class="rail-col"><h3>Vehicle fleet</h3><div class="avail-list"></div></div>`);
  const vList = vehCol.querySelector('.avail-list');
  VEHICLES.forEach(v=>{
    vList.appendChild(el(`<div class="avail-item">
      <div><div class="name">${v.regNo}</div><div class="sub">${v.name} · max ${v.maxCapacity} kg</div></div>
      ${statusBadge(v.status)}
    </div>`));
  });

  const drvCol = el(`<div class="rail-col"><h3>Driver roster</h3><div class="avail-list"></div></div>`);
  const dList = drvCol.querySelector('.avail-list');
  DRIVERS.forEach(d=>{
    const expired = d.licenseExpiry < todayStr();
    dList.appendChild(el(`<div class="avail-item">
      <div><div class="name">${d.name}</div><div class="sub">${d.licenseCategory} · exp ${d.licenseExpiry}${expired?' ⚠':''}</div></div>
      ${statusBadge(d.status)}
    </div>`));
  });

  rail.append(vehCol, drvCol);
  return rail;
}


function openNewTripModal(){
  const modal = el(`<div class="modal-backdrop"><div class="modal">
    <div class="modal-head"><h3>New trip</h3><button class="modal-close">✕</button></div>
    <div class="modal-body">
      <div id="mErr"></div>
      <div class="field-row">
        <div class="field"><label>Source</label><input id="m-src" placeholder="e.g. Pune"></div>
        <div class="field"><label>Destination</label><input id="m-dst" placeholder="e.g. Mumbai"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Cargo weight (kg)</label><input id="m-cargo" type="number" min="0"></div>
        <div class="field"><label>Planned distance (km)</label><input id="m-dist" type="number" min="0"></div>
      </div>
      <div class="field"><label>Expected revenue (₹, optional)</label><input id="m-rev" type="number" min="0"></div>
      <div class="hint">A trip is created as a Draft. Assign a vehicle &amp; driver when you dispatch it.</div>
    </div>
    <div class="modal-foot"><button class="btn" id="mCancel">Cancel</button><button class="btn btn-amber" id="mSave">Create draft</button></div>
  </div></div>`);
  document.body.appendChild(modal);
  const close = ()=>modal.remove();
  modal.querySelector('.modal-close').onclick = close;
  modal.querySelector('#mCancel').onclick = close;
  modal.addEventListener('click', e=>{ if(e.target===modal) close(); });
  modal.querySelector('#mSave').onclick = ()=>{
    try{
      createTrip({
        source: modal.querySelector('#m-src').value,
        destination: modal.querySelector('#m-dst').value,
        cargoWeight: modal.querySelector('#m-cargo').value,
        plannedDistance: modal.querySelector('#m-dist').value,
        revenue: modal.querySelector('#m-rev').value,
      });
      toast('Trip created as Draft.'); close(); render();
    }catch(err){
      modal.querySelector('#mErr').innerHTML = `<div class="form-alert">${err.message}</div>`;
    }
  };
}

function openDispatchModal(trip){
  const veh = availableVehicles();
  const drv = availableDrivers();
  const modal = el(`<div class="modal-backdrop"><div class="modal">
    <div class="modal-head"><h3>Dispatch ${trip.source} → ${trip.destination}</h3><button class="modal-close">✕</button></div>
    <div class="modal-body">
      <div id="mErr"></div>
      <div class="field">
        <label>Vehicle</label>
        <select id="m-veh">
          <option value="">— select —</option>
          ${veh.map(v=>`<option value="${v.id}">${v.regNo} · ${v.name} (max ${v.maxCapacity} kg)</option>`).join('')}
        </select>
        <div id="capCheck" class="cap-check"></div>
      </div>
      <div class="field">
        <label>Driver</label>
        <select id="m-drv">
          <option value="">— select —</option>
          ${drv.map(d=>`<option value="${d.id}">${d.name} · ${d.licenseCategory} (exp ${d.licenseExpiry})</option>`).join('')}
        </select>
      </div>
      <div class="hint">Cargo for this trip: <b>${trip.cargoWeight} kg</b>. Only vehicles/drivers currently eligible are listed.</div>
    </div>
    <div class="modal-foot"><button class="btn" id="mCancel">Cancel</button><button class="btn btn-go" id="mSave">Confirm dispatch</button></div>
  </div></div>`);
  document.body.appendChild(modal);
  const close = ()=>modal.remove();
  modal.querySelector('.modal-close').onclick = close;
  modal.querySelector('#mCancel').onclick = close;
  modal.addEventListener('click', e=>{ if(e.target===modal) close(); });

  const vehSel = modal.querySelector('#m-veh');
  const capCheck = modal.querySelector('#capCheck');
  vehSel.onchange = ()=>{
    const v = getVehicle(vehSel.value);
    if(!v){ capCheck.textContent=''; return; }
    const ok = Number(trip.cargoWeight) <= Number(v.maxCapacity);
    capCheck.innerHTML = ok
      ? `<span class="cap-ok">✓ ${trip.cargoWeight} kg fits within ${v.maxCapacity} kg capacity</span>`
      : `<span class="cap-bad">✕ ${trip.cargoWeight} kg exceeds ${v.maxCapacity} kg capacity</span>`;
  };

  modal.querySelector('#mSave').onclick = ()=>{
    try{
      dispatchTrip(trip.id, vehSel.value, modal.querySelector('#m-drv').value);
      toast('Trip dispatched. Vehicle & driver marked On Trip.'); close(); render();
    }catch(err){
      modal.querySelector('#mErr').innerHTML = `<div class="form-alert">${err.message}</div>`;
    }
  };
}

function openCompleteModal(trip){
  const v = getVehicle(trip.vehicleId);
  const modal = el(`<div class="modal-backdrop"><div class="modal">
    <div class="modal-head"><h3>Complete trip</h3><button class="modal-close">✕</button></div>
    <div class="modal-body">
      <div id="mErr"></div>
      <div class="hint" style="margin-bottom:12px;">${trip.source} → ${trip.destination} · ${v?v.regNo:''}</div>
      <div class="field-row">
        <div class="field"><label>Actual distance (km)</label><input id="m-adist" type="number" min="0" value="${trip.plannedDistance}"></div>
        <div class="field"><label>Fuel consumed (L)</label><input id="m-fuel" type="number" min="0"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" id="mCancel">Cancel</button><button class="btn btn-go" id="mSave">Mark completed</button></div>
  </div></div>`);
  document.body.appendChild(modal);
  const close = ()=>modal.remove();
  modal.querySelector('.modal-close').onclick = close;
  modal.querySelector('#mCancel').onclick = close;
  modal.addEventListener('click', e=>{ if(e.target===modal) close(); });
  modal.querySelector('#mSave').onclick = ()=>{
    try{
      completeTrip(trip.id, modal.querySelector('#m-adist').value, modal.querySelector('#m-fuel').value);
      toast('Trip completed. Vehicle & driver marked Available.'); close(); render();
    }catch(err){
      modal.querySelector('#mErr').innerHTML = `<div class="form-alert">${err.message}</div>`;
    }
  };
}


function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(renderTopbar());
  app.appendChild(renderSignalStrip());
  app.appendChild(renderBoardSection());
  app.appendChild(renderAvailabilityRail());
}


(function init(){
  const had = loadState();
  if(!had || state.trips.length===0) seedTrips();
  render();
})();
</script>
</body>
</html>
